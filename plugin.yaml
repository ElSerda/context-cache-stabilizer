name: context-cache-stabilizer
version: 0.2.0
manifest_version: 2
api_version: 1
description: "Measures what Hermes sends to the model on every request: sizes, prefix reuse, real token counts (read-only)"
author: ElSerda
license: MIT
requires_hermes: ">=0.23.3"
tags: [context, tokens, cache, measurement]
provides_hooks:
  - post_api_request
provides_middleware:
  - llm_execution

config_schema:
  enabled:
    type: bool
    default: true
    label: Measure requests
    description: "Write one line per request to plugin-data/context-cache-stabilizer/requests.jsonl (sizes only, no message text)"
